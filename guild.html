    if (rank === 5) return 100000;

    if (rank <= 20) return 60000;
    if (rank <= 30) return 40000;
    if (rank <= 50) return 20000;

  // 원본 객체 형식을 화면 표시에 맞는 구조로 변환
  function parseMasterRawData(rawList) {
    return rawList.map(item => {
      let totalStones = 0;
      let count = 0;
      const records = [];

      for (let zone in item.zones) {
        const valStr = item.zones[zone]; // 예: "9위 (960,145)"
        const rankMatch = valStr.match(/(\d+)위/);
        const scoreMatch = valStr.match(/\(([\d,]+)\)/);

        const rank = rankMatch ? parseInt(rankMatch[1]) : 99;
        const score = scoreMatch ? parseInt(scoreMatch[1].replace(/,/g, '')) : 0;
        const stones = getStoneRewardByRank(rank);

        totalStones += stones;
        count++;
        records.push({ zone, rank, score, stones });
      }

      return {
        name: item.name,
        totalScore: item.total,
        totalStones: totalStones,
        count: count,
        records: records
      };
    });
  }

  // 엑셀 붙여넣기 시 덮어쓰고 로컬스토리지에 영구 저장
  function processGuildTSVData() {
    const raw = document.getElementById("guild_tsv_input").value.trim();
    if (!raw) {
      alert("데이터를 입력해 주세요.");
      return;
    }

    const rows = raw.split("\n");
    const tempMap = new Map();

    rows.forEach(row => {
      const cols = row.split("\t").map(c => c.trim());
      if (cols.length < 4) return;
      const zone = cols[0];
      const rank = parseInt(cols[1].replace(/[^0-9]/g, ''));
      const name = cols[2];
      const score = parseInt(cols[3].replace(/[^0-9]/g, ''));

      if (!name || isNaN(rank) || isNaN(score)) return;

      if (!tempMap.has(name)) {
        tempMap.set(name, { name: name, totalScore: 0, totalStones: 0, count: 0, records: [] });
      }
      const item = tempMap.get(name);
      const stones = getStoneRewardByRank(rank);
      item.totalScore += score;
      item.totalStones += stones;
      item.count += 1;
      item.records.push({ zone, rank, score, stones });
    });

    if (tempMap.size === 0) {
      alert("올바른 엑셀 형식이 아닙니다. [구역, 순위, 길드명, 점수] 형태로 복사했는지 확인해 주세요.");
      return;
    }

    guildDatabase = Array.from(tempMap.values());
    localStorage.setItem("guild_db_cache", JSON.stringify(guildDatabase));
    document.getElementById("data_source_badge").innerText = "사용자 엑셀 데이터 반영됨";
    document.getElementById("data_source_badge").style.background = "#10b981";
    document.getElementById("guild_tsv_input").value = "";
    closeGuildImportModal();
    sortGuildCards();
    alert("데이터가 성공적으로 덮어씌워졌으며 자동 저장되었습니다.");
  }

  function renderGuildCards(list) {
    const container = document.getElementById("guildCardContainer");
    if (!container) return;

    if (list.length === 0) {
      container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8; background:#0f172a; border-radius:12px; border:1px dashed #334155;">등록된 길드 데이터가 없습니다.</div>`;
      return;
    }

    container.innerHTML = list.map(g => `
      <div style="background:#0f172a; border:1.5px solid #334155; border-radius:12px; padding:16px; display:flex; flex-direction:column; justify-content:space-between;">
        <div style="border-bottom:1px solid #1e293b; padding-bottom:10px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
          <strong style="font-size:16px; color:#38bdf8;">${g.name}</strong>
          <span style="font-size:11.5px; background:rgba(56, 189, 248, 0.15); color:#7dd3fc; border:1px solid #0284c7; padding:2px 8px; border-radius:6px; font-weight:bold;">${g.count}개 구역 출현</span>
        </div>
        <div style="font-size:13.5px; margin-bottom:12px;">
          <div>총 누적 점수: <strong style="color:#ffffff;">${g.totalScore.toLocaleString()}점</strong></div>
          <div style="margin-top:2px;">예상 총 각성석: <strong style="color:#34d399;">${g.totalStones.toLocaleString()}개</strong></div>
        </div>
        <div style="background:#1e293b; border-radius:8px; padding:8px 10px; font-size:12px; color:#cbd5e1; max-height:120px; overflow-y:auto;">
          ${g.records.map(r => `<div>• <strong>${r.zone}</strong>: ${r.rank}위 (${r.score.toLocaleString()}점 / 각성석 ${r.stones.toLocaleString()}개)</div>`).join('')}
        </div>
      </div>
    `).join('');
  }

  function sortGuildCards() {
    const sortType = document.getElementById("guildSortSelect").value;
    let list = [...guildDatabase];
    if (sortType === 'total') list.sort((a,b) => b.totalScore - a.totalScore);
    else if (sortType === 'stones') list.sort((a,b) => b.totalStones - a.totalStones);
    else if (sortType === 'count') list.sort((a,b) => b.count - a.count);
    else if (sortType === 'name') list.sort((a,b) => a.name.localeCompare(b.name));
    renderGuildCards(list);
  }

  function filterGuildCards() {
    const q = document.getElementById("guildSearchInput").value.trim().toLowerCase();
    const filtered = guildDatabase.filter(g => g.name.toLowerCase().includes(q));
    renderGuildCards(filtered);
  }

  // 로컬스토리지 우선 확인 ➔ 없으면 기본 마스터 데이터 로드
  window.addEventListener("DOMContentLoaded", () => {
    const cached = localStorage.getItem("guild_db_cache");
    if (cached) {
      try {
        guildDatabase = JSON.parse(cached);
        document.getElementById("data_source_badge").innerText = "사용자 엑셀 데이터 반영됨";
        document.getElementById("data_source_badge").style.background = "#10b981";
      } catch (e) {
        guildDatabase = parseMasterRawData(DEFAULT_MASTER_RAW);
      }
    } else {
      guildDatabase = parseMasterRawData(DEFAULT_MASTER_RAW);
    }
    sortGuildCards();
  });
</script>

</body>
</html>
